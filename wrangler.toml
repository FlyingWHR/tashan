# Cloudflare Pages configuration for tashan.
#
# Bindings live HERE, not only in the dashboard, so a deploy is reproducible and reviewable. The
# paid tier depends entirely on TASHAN_KV: /api/history and /api/security both read from it, and
# without the binding they return 503 — which is the correct failure (a paywall must fail closed),
# but it means a customer who has paid gets nothing. Losing this file loses the paid product.
#
# WHAT IS A SECRET AND WHAT IS NOT:
#   POLAR_ORG_ID          NOT a secret. It is the public organisation id, already shipped inside
#                         cli/tashan.mjs as a default, and Polar's licence-validation endpoint is
#                         public and keyless by design. It is a var.
#   POLAR_WEBHOOK_SECRET  A real secret. Set with:
#                             npx wrangler@3 pages secret put POLAR_WEBHOOK_SECRET --project-name tashan
#                         functions/api/polar.js fails closed without it, so billing webhooks 403
#                         until it is set — and Polar disables an endpoint after 10 failures.
#
# The Polar ORGANISATION API TOKEN is deliberately absent: nothing in this codebase needs it. Licence
# validation and the customer portal both run against public endpoints.

name = "tashan"
pages_build_output_dir = "web"
compatibility_date = "2026-07-31"

[vars]
POLAR_ORG_ID = "caa0fc1b-2f7f-4e52-864a-c71e878d125d"

# The only store the paid tier has. `hist:<bucket>` shards are written by pipeline/push_history.py
# and `sec:<bucket>` by pipeline/push_security.py, both using the same 64-bucket character-sum
# arithmetic that functions/api/{history,security}.js mirror.
[[kv_namespaces]]
binding = "TASHAN_KV"
id = "1f68077762cc4fdb938d3dcf35774c69"

# EVERY VISIT WAS BEING THROWN AWAY. js/site.js POSTs to /api/e, the endpoint answers 204, and
# functions/api/e.js writes the row only `if (env.TASHAN_AE)` — which was never true, because the
# binding did not exist. A 204 from an endpoint that discards its input is indistinguishable from
# one that records it, so nothing anywhere said so.
#
# It cost nothing while nobody was visiting. It costs the answer to "which outreach worked" the
# moment somebody is, and Analytics Engine cannot backfill any more than signal_history can.
#
# Declared here rather than in the dashboard because this project's bindings are file-managed —
# Settings > Bindings is greyed out for exactly that reason, which is easy to read as a permissions
# problem. Free plan: 100,000 data points written and 10,000 read queries per day.
#
# COMMENTED OUT UNTIL ANALYTICS ENGINE IS ENABLED ON THE ACCOUNT, because an unbindable dataset
# fails the WHOLE deploy — "Failed to publish your Function. Got error: You need to enable Analytics
# Engine" — and that would take the nightly deploy down with it for a feature nothing yet depends
# on. Same shape as R2: a per-account toggle, not a per-project one.
#
#   1. https://dash.cloudflare.com/9ffa373bbc77a0885b1f78b41c0c8dfc/workers/analytics-engine  -> Enable
#   2. uncomment the three lines below
#   3. npx wrangler@3 pages deploy web --project-name tashan
#
# [[analytics_engine_datasets]]
# binding = "TASHAN_AE"
# dataset = "tashan_events"

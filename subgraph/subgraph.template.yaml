# Base USDC transfers to receiver addresses published in Coinbase x402 Bazaar.
# A transfer can include other activity at the same address.
# THE ADDRESS LIST IS GENERATED, NOT HAND-KEPT. `node scripts/receivers.mjs` rewrites it from the
# Bazaar. Editing subgraph.yaml by hand loses the next harvest; edit this template instead.
specVersion: 1.2.0
description: Base USDC transfers to addresses listed in Coinbase x402 Bazaar.
repository: https://github.com/FlyingWHR/tashan
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: USDC
    network: base
    source:
      address: "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913"
      abi: USDC
      # Base block 48621746, roughly 60 days back. The x402 economy is younger than that, and a
      # start block chosen for the chain's whole history would cost hours of sync for nothing.
      startBlock: 48621746
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/mapping.ts
      entities:
        - Receiver
        - Payment
        - ReceiverDay
        - Payer
        - PayerReceiver
        - Economy
      abis:
        - name: USDC
          file: ./abis/USDC.json
      eventHandlers:
        - event: Transfer(indexed address,indexed address,uint256)
          handler: handleTransfer
          topic2: __RECEIVERS__

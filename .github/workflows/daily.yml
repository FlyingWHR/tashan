# tashan — the daily heartbeat.
#
# This exists to protect the only asset that compounds. `signal_history` records one trust/adoption
# snapshot per capability per day; "added, then removed" is a verdict that can only be ACCUMULATED,
# never backfilled. A competitor starting later cannot buy the missing days — but neither can we.
#
# Before this file the series had 3 days in it and had already missed two, because it only advanced
# when a human happened to run the pipeline. That is not a moat, it is a hobby. Now it runs whether
# anyone is watching or not.
#
# Deliberately light: no runners beyond ubuntu-latest, no services, no secrets other than the token
# GitHub already provides. The pipeline is stdlib Python + the gh CLI, both preinstalled.

name: daily

on:
  schedule:
    - cron: "17 6 * * *"      # 06:17 UTC daily — off the hour, registries are quieter
  workflow_dispatch:           # and runnable by hand

permissions:
  contents: write              # to commit the day's snapshot back
  issues: write                # to raise the alarm when publication freezes (see the last step)

concurrency:
  group: daily
  cancel-in-progress: false    # never interrupt a run mid-write; the DB is the source of truth

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # JOB level, deliberately. A step's own `env:` block is NOT in scope for that step's `if:`, so
    # gating the deploy on `env.CLOUDFLARE_API_TOKEN` declared beside it would read empty every time
    # and silently never deploy — a skipped step looks identical to a passing one in the UI.
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # THE DATABASE IS A CACHE, AND IT LIVES IN R2 RATHER THAN IN GIT. It reached 98.8 MiB against
      # GitHub's hard 100 MiB blob limit, so the push — not the pipeline — was days from failing,
      # and a rejected push means the day's history shard never lands. See pipeline/db_store.py for
      # why the answer is object storage and not Postgres: nothing serves a request from SQLite.
      #
      # continue-on-error while R2 is being switched on. A failed pull keeps whatever database the
      # checkout provided and says so; it never blocks the measurement.
      - name: Fetch the database cache
        id: dbpull
        continue-on-error: true
        run: python3 pipeline/db_store.py pull

      - name: Run the pipeline (incremental)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # scraper + registry ingest use the gh CLI
          # THE PAID PRODUCT'S DELIVERY PATH. push_security and push_history upload the licensed half
          # to Cloudflare KV, and they were never given credentials — so they printed SKIPPED every
          # night and the store stayed empty. The gate worked, the licence validated, and behind it
          # /api/security returned `{"detail": null, "note": "no audit detail recorded for this id"}`
          # for EVERY capability. A subscriber was paying for a store nothing had ever written to.
          #
          # Reuses the deploy credentials; the namespace id is not a secret, it is committed in
          # wrangler.toml. The token needs Workers KV Storage:Edit, which the "Edit Cloudflare
          # Workers" template already grants.
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_KV_NAMESPACE_ID: "1f68077762cc4fdb938d3dcf35774c69"
          # The two coverage axes an agent notices missing — expertise grade and task mapping — both
          # need this and neither ran in the loop. Without it both stages skip loudly and coverage
          # simply stops advancing, which is how 18 of the top 20 by downloads ended up ungraded.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        # SAME LESSON AS THE SUITE GATE BELOW, ONE LEVEL UP, AND IT TOOK FOUR LOST DAYS TO SEE.
        # A crash in any stage failed the job, so the commit step never ran and the day was gone —
        # and five source stages run before the snapshot, every one of them doing network I/O
        # against registries that go down. 07-26, 07-31, 08-02 and 08-07 are holes in the one asset
        # that cannot be backfilled, and CLAUDE.md already says why that matters more than anything
        # else here. The pipeline is allowed to fail; it is not allowed to take the record with it.
        id: pipeline
        continue-on-error: true
        run: python3 pipeline/run.py

      # Whatever the pipeline managed to score, get it onto disk as a shard. snapshot_history writes
      # nothing for a day with no rows, so a pipeline that died before compute_scores leaves no
      # empty shard behind to be mistaken for a finished day.
      - name: Snapshot the series, whatever else happened
        if: always()
        run: python3 pipeline/snapshot_history.py

      # Store the cache before the suite runs, not after: the suite is allowed to be red and the
      # cache is still the correct output of the measurement. Losing it costs the next run its
      # incremental cursors for no reason.
      - name: Store the database cache
        id: dbpush
        if: always()
        continue-on-error: true       # reported at the end instead, so it cannot block the deploy
        run: python3 pipeline/db_store.py push

      # Runs to completion and records its verdict rather than ending the job here. A red suite must
      # still stop the SITE from changing — but it must not also destroy the day's measurement, and
      # those had been the same gate. The first run that got this far failed on a taxonomy ratchet
      # (tests/test_classify.py, deliberately un-tunable) and would have thrown away an irreplaceable
      # day of retention data over a content-quality regression.
      - name: Verify before publishing anything
        id: verify
        continue-on-error: true
        run: bash tests/run.sh

      - name: Commit the day's snapshot
        if: always()          # the record outlives every failure above it
        run: |
          git config user.name  "tashan-bot"
          git config user.email "bot@tashan.sh"
          # The snapshot count is the headline: it is the thing that cannot be reconstructed later.
          # Counted from the COMMITTED shards, not the DB. data/history is the series; the DB is a
          # cache of it, and the cache is the copy that drifts — a red night commits the shard and
          # withholds the DB, so the two disagree until snapshot_history.restore() reconciles them
          # on the next run. On 8 Aug the shards held twelve days and the DB held ten.
          #
          # (This comment used to say the runner "builds a throwaway DB from scratch every night".
          # It does not — data/tashan.db is tracked and checkout restores it. Verify with
          # `git ls-files data/tashan.db` before repeating that.)
          DAYS=$(ls data/history/*.csv.gz 2>/dev/null | wc -l | tr -d ' ')
          if [ "${{ steps.verify.outcome }}" = "success" ] \
            && [ "${{ steps.pipeline.outcome }}" = "success" ]; then
            git add -A
            MSG="daily: measure ($DAYS days of retention history)"
          elif [ "${{ steps.pipeline.outcome }}" != "success" ]; then
            git add data/history
            MSG="daily: retention only ($DAYS days) — PIPELINE CRASHED, see the run log"
          else
            # ONLY the retention shards. They live outside web/ and are served from nowhere, so this
            # publishes nothing even if Pages is ever wired to build from git — while everything that
            # renders stays behind the gate, uncommitted, exactly as a red suite requires.
            git add data/history
            MSG="daily: retention only ($DAYS days) — suite red, site artifacts withheld"
          fi
          if git diff --cached --quiet; then
            echo "no change today"
          else
            git commit -m "$MSG"
            git push
          fi

      # PUBLISH — only when the suite was green. Measuring nightly and publishing by hand meant the
      # live site drifted behind the data by however long it took someone to remember: the pipeline
      # ran daily for weeks while tashan.sh served whatever build was last uploaded manually, and a
      # full upload is ~18,000 files and 20+ minutes of somebody's evening.
      #
      # Gated on the secret, not just the verdict, so a fork or a repo without Cloudflare credentials
      # runs the whole pipeline and simply skips this step instead of failing red for a reason that
      # has nothing to do with the measurement.
      - name: Deploy to Cloudflare Pages
        if: steps.verify.outcome == 'success' && steps.pipeline.outcome == 'success' && env.CLOUDFLARE_API_TOKEN != ''
        run: |
          # Pages refuses any deployment over 20,000 files. Check BEFORE uploading: the failure
          # arrives after wrangler has walked the whole tree, and the site is then unpublishable with
          # no warning anywhere earlier in the pipeline. This is how it was found the first time.
          FILES=$(find web -type f | wc -l | tr -d ' ')
          echo "web/ holds $FILES files (Cloudflare Pages hard limit: 20,000)"
          if [ "$FILES" -ge 20000 ]; then
            echo "::error::$FILES files exceeds the Pages limit — deployment would be REFUSED outright."
            echo "::error::Badges are already served by functions/badge; the next lever is pages per capability."
            exit 1
          fi
          npx wrangler@3 pages deploy web --project-name tashan --commit-dirty=true

      # THE CACHE IS THE ONLY COPY NOW. data/tashan.db is no longer in git, so a push that fails
      # every night means the object silently stops advancing and every run starts from an older
      # one — the incremental cursors stop moving and nothing says so. The most likely cause is
      # mundane: CLOUDFLARE_API_TOKEN was created for Pages and Workers KV, and R2 is a separate
      # permission (R2 Storage: Edit). Reported LAST, and continue-on-error above, so a broken token
      # still lets the measurement, the commit and the deploy finish — but the run goes red.
      # AFTER the deploy, because submitting a URL before the new build is live asks an engine to
      # crawl the old page. Only what changed: the protocol takes 10,000 URLs and posting the whole
      # sitemap nightly is both throttled and untrue. Never fatal — this is distribution, and the
      # job's real work is measurement.
      - name: Tell IndexNow what changed
        if: steps.verify.outcome == 'success' && steps.pipeline.outcome == 'success'
        continue-on-error: true
        run: python3 pipeline/indexnow.py

      - name: Surface a failed cache store
        if: always() && steps.dbpush.outcome != 'success'
        run: |
          echo "::error::db_store push FAILED — r2://tashan-state/tashan.db was not updated."
          echo "::error::Every later run will start from a stale cache and the incremental"
          echo "::error::cursors will stop advancing. Most likely CLOUDFLARE_API_TOKEN lacks"
          echo "::error::'R2 Storage: Edit'. The retention shards in data/history are unaffected."
          exit 1

      # RAISE THE ALARM WHERE IT CANNOT BE MISSED, before failing the job.
      #
      # This workflow already exited 1 with ::error:: on every red night, and it went unnoticed for
      # SEVEN CONSECUTIVE NIGHTS: seven commits reading "retention only — site artifacts withheld"
      # while the database advanced and the published board fell 1,189 capabilities behind. Nobody
      # is watching a check mark on a scheduled run. An issue emails, sits at the top of the repo,
      # and stays open until someone closes it — and because it is REOPENED and commented rather
      # than duplicated, the comment count is the number of nights the site has been frozen, which
      # is the one number that makes the cost obvious.
      - name: Raise an issue when publication is frozen
        if: always() && (steps.verify.outcome != 'success' || steps.pipeline.outcome != 'success')
        env:
          GH_TOKEN: ${{ github.token }}
        continue-on-error: true      # never let the alarm itself become the failure
        run: |
          TITLE="nightly: site publication is frozen"
          BODY=$(printf '%s\n' \
            "The daily run could not publish. Retention shards were preserved; every site artifact" \
            "was withheld and nothing was deployed, so **tashan.sh is serving stale data**." \
            "" \
            "- pipeline: \`${{ steps.pipeline.outcome }}\`" \
            "- suite:    \`${{ steps.verify.outcome }}\`" \
            "- run:      ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "" \
            "Each comment below is one more night frozen. Close this issue once a run publishes.")
          NUM=$(gh issue list --state all --search "$TITLE in:title" --limit 1 --json number \
                  --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$NUM" ]; then
            gh issue reopen "$NUM" 2>/dev/null || true
            gh issue comment "$NUM" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY" --label "" 2>/dev/null \
              || gh issue create --title "$TITLE" --body "$BODY"
          fi

      # And close it the moment a run publishes again, so an open issue always means "frozen right
      # now" rather than "was broken once". An alarm that stays on after the fire is out gets muted.
      - name: Clear the alarm once publishing resumes
        if: steps.verify.outcome == 'success' && steps.pipeline.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        continue-on-error: true
        run: |
          NUM=$(gh issue list --state open --search "nightly: site publication is frozen in:title" \
                  --limit 1 --json number --jq '.[0].number' 2>/dev/null || true)
          [ -n "$NUM" ] && gh issue close "$NUM" \
            --comment "Published again — run ${{ github.run_id }}." || true

      - name: Surface the verification result
        if: steps.verify.outcome != 'success'
        run: |
          echo "::error::tests/run.sh failed. The day's retention shards were preserved; every site"
          echo "::error::artifact was withheld and is NOT committed, and NOTHING was deployed."
          echo "::error::Fix the suite, then re-run."
          exit 1

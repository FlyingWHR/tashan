# Publish tashan-cli to npm via TRUSTED PUBLISHING (OIDC) — no token, provenance automatic.
#
# The strongest line in our own outreach is that ~75% of scanned MCP servers ship with no build
# provenance — nothing tying the published tarball to the source repo it points at. tashan-cli 0.1.2
# was published from a laptop and is in that 75%. Telling people to check provenance while having
# none is the kind of thing an independent rater gets exactly one chance to be caught doing.
#
# WHY OIDC AND NOT AN NPM TOKEN. The first version of this workflow used `--provenance` with an
# NPM_TOKEN secret. Trusted publishing is strictly better on three counts:
#   - There is no long-lived credential. npm trusts THIS repo and THIS workflow file directly, so
#     there is no secret to leak, rotate, or scope wrong.
#   - Provenance is generated automatically. No `--provenance` flag, and no way to publish
#     unattested by forgetting one.
#   - It survives 2FA enforcement. npm's "require 2FA and disallow tokens" setting blocks token
#     auth and leaves OIDC working, so the account can be locked down without breaking releases.
#
# ONE-TIME SETUP (a human must do this once — the workflow cannot grant itself trust):
#   npmjs.com -> the `tashan-cli` package -> Settings -> Trusted Publisher -> Select your publisher
#     Publisher:          GitHub Actions
#     Organization/user:  FlyingWHR
#     Repository:         tashan
#     Workflow filename:  publish-cli.yml        <- FILENAME ONLY, case-sensitive, with .yml
#     Environment:        (leave blank)
#     Allowed actions:    npm publish
#   Every field is matched exactly. "publish-cli" or ".github/workflows/publish-cli.yml" both fail.
#   RENAMING THIS FILE BREAKS PUBLISHING until the setting is updated to match.
#
# Deliberately manual (`workflow_dispatch`), not on push: publishing is outward-facing and
# irreversible — npm unpublish is restricted after 72 hours — so it happens when a human says so.
# This workflow both dispatches AND publishes; do not split the publish into a reusable workflow,
# because npm validates the name of the CALLING workflow, not the one running `npm publish`.
name: publish cli

on:
  workflow_dispatch:
    inputs:
      dry_run:
        # UNCHECK THIS TO ACTUALLY PUBLISH. It stays defaulted to true — a publish is irreversible
        # after 72 hours and the safe default is the one that does nothing — but a dry run used to
        # be INDISTINGUISHABLE from a real one: `publish` and its verification were both skipped and
        # the run still reported green. Run 31254211591 looked exactly like a success and shipped
        # nothing, which is why 0.1.4 was still not on npm after two attempts. The final step now
        # writes what actually happened to the run summary.
        description: "DRY RUN — pack and verify only. UNCHECK to publish for real."
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write        # REQUIRED: this is the OIDC token npm exchanges for publish rights

jobs:
  # TEST THE RANGE WE CLAIM, not the one we publish from. cli/package.json declares
  # `engines: {"node": ">=18"}`, and that is a promise to anyone running `npx tashan-cli` on an older
  # runtime. Testing only on the newest Node would let syntax past the floor we advertise and break a
  # user we told we supported — the same class of defect as any other claim the code does not keep.
  # 18 is the declared floor, 22 is LTS Jod, 24 is LTS Krypton and what we publish from.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false          # a break on 18 and a break on 24 are different bugs; see both
      matrix:
        node: ["18", "22", "24"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      # The published package is the artifact, not the repo. npm's `bin` entries are SYMLINKS on
      # install, so argv[1] never equals import.meta.url on a real machine — a bug that only appears
      # in the installed tarball and passed every in-repo run. Test what ships.
      - name: test on Node ${{ matrix.node }}
        working-directory: cli
        run: node -v && npm test

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # NODE 24, AND THE REASON IS npm. Trusted publishing needs npm >= 11.5.1, and no Node 22
      # release ever ships it — the whole 22.x line tops out at npm 10.9.x (checked against
      # nodejs.org/dist/index.json, latest 22.23.2 = npm 10.9.8). The first Node bundling a new
      # enough npm is 24.5.0 (npm 11.5.1); 24 is current LTS "Krypton" and ships npm 11.17.0.
      # Using it removes a global `npm install -g npm@latest` step that existed only to paper over
      # the wrong runtime. The version gate below stays as the assertion, not as the fix.
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org/

      - name: npm satisfies trusted publishing (>= 11.5.1)
        run: |
          node -v
          NPM_V="$(npm -v)"; MIN=11.5.1
          # sort -V, not a hand-rolled semver compare: an earlier draft of this step built the
          # version in an `env:` block that resolved to the empty string, so the gate could only
          # ever fail. Comparing in the shell keeps the value and the check visible together.
          if [ "$(printf '%s\n%s\n' "$MIN" "$NPM_V" | sort -V | head -1)" != "$MIN" ]; then
            echo "npm $NPM_V is below $MIN. Node $(node -v) does not bundle a new enough npm —"
            echo "raise node-version rather than installing npm globally over the top."; exit 1
          fi
          echo "npm $NPM_V supports trusted publishing"

      # ESM, and --input-type=module rather than a bare `node -e`: cli/package.json declares
      # "type": "module", so which module system `-e` gets depends on the Node version. Pinning it
      # means this step cannot start failing on a runner image bump for a reason unrelated to us.
      - name: pack and inspect what would ship
        working-directory: cli
        run: |
          npm pack --dry-run
          node --input-type=module -e "
            import { readFileSync } from 'node:fs';
            const p = JSON.parse(readFileSync('./package.json', 'utf8'));
            for (const [name, rel] of Object.entries(p.bin || {})) {
              if (!(p.files || []).includes(rel)) {
                console.error('bin ' + name + ' -> ' + rel + ' is not in files[]; it would not ship');
                process.exit(1);
              }
            }
            // The MCP registry rejects a publish whose package.json mcpName does not match
            // server.json's name. Both files are individually valid, so this is invisible until the
            // registry publish fails — after the DNS record and signing key are already set up.
            const s = JSON.parse(readFileSync('../server.json', 'utf8'));
            if (p.mcpName !== s.name) {
              console.error('mcpName ' + p.mcpName + ' != server.json name ' + s.name);
              process.exit(1);
            }
            if (p.version !== s.version) {
              console.error('version ' + p.version + ' != server.json version ' + s.version);
              process.exit(1);
            }
            console.log('bin entries ship:', Object.keys(p.bin).join(', '));
            console.log('mcpName agrees with server.json:', p.mcpName, '@', p.version);
          "

      # No NODE_AUTH_TOKEN and no --provenance: OIDC supplies the credential and npm attaches the
      # attestation itself. If this fails with an auth error, the trusted publisher above has not
      # been configured yet, or one of its fields does not match this repo exactly.
      - name: publish
        if: ${{ !inputs.dry_run }}
        working-directory: cli
        run: npm publish --access public

      # Reads back what npm actually recorded. A publish that lost provenance would otherwise look
      # identical to a good one, and we would go on citing a number we had quietly stopped meeting.
      # VERIFY THE PUBLISH, AND REPORT PROVENANCE HONESTLY.
      #
      # This step used to `exit 1` whenever attestations were absent, and attestations CANNOT be
      # present here: npm builds provenance from a PUBLIC source repository and this one is private.
      # So the workflow published successfully and then went red, every time — and a red X after a
      # successful publish is worse than no check at all. tashan-cli@0.1.3 shipped on 7 Aug under
      # exactly that failure, and the run being red is a fair reason to believe publishing is broken
      # and not try again. It is why 0.1.4, which stops the CLI calling Microsoft's Playwright server
      # malware, sat unpublished for a day.
      #
      # What must be true is that THE VERSION IS ON npm. Provenance is reported, and only enforced
      # where it is achievable — if this repository is ever made public, its absence becomes a real
      # regression and this fails again.
      - name: verify the publish landed
        if: ${{ !inputs.dry_run }}
        env:
          IS_PRIVATE: ${{ github.event.repository.private }}
        run: |
          sleep 15
          node --input-type=module -e "
            import { readFileSync } from 'node:fs';
            const v = JSON.parse(readFileSync('./cli/package.json', 'utf8')).version;
            const d = await fetch('https://registry.npmjs.org/tashan-cli').then(r => r.json());
            if (!d.versions?.[v]) {
              console.error('tashan-cli@' + v + ' is NOT on npm — the publish did not land.');
              process.exit(1);
            }
            console.log('tashan-cli@' + v + ' is live; latest =', d['dist-tags']?.latest);
            const att = !!d.versions?.[v]?.dist?.attestations;
            console.log('tashan-cli@' + v + ' attestations:', att);
            if (att || process.env.IS_PRIVATE === 'true') {
              if (!att) console.log('no provenance: npm builds attestations from a PUBLIC source');
              if (!att) console.log('repo and this one is private. start.html says so plainly.');
              process.exit(0);
            }
            console.error('public repo published WITHOUT provenance — check id-token: write and');
            console.error('that the trusted publisher names this exact workflow file.');
            process.exit(1);
          "

      # SAY WHICH OF THE TWO THINGS HAPPENED, at the top of the run page. A skipped publish and a
      # completed publish both leave a green tick, and the difference is the entire point of the
      # workflow.
      - name: What this run did
        if: always()
        run: |
          V=$(node -p "require('./cli/package.json').version")
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            {
              echo "## ⚠️ DRY RUN — nothing was published"
              echo ""
              echo "\`tashan-cli@$V\` was packed and tested. **npm was not touched.**"
              echo ""
              echo "To publish for real: **Run workflow** → **uncheck \`DRY RUN\`** → Run workflow."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::DRY RUN — nothing was published. Re-run with dry_run unchecked."
          else
            {
              echo "## ✅ Published \`tashan-cli@$V\`"
              echo ""
              echo "Verify: \`npx tashan-cli@latest --version\`"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

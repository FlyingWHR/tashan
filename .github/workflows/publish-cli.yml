# Publish tashan-cli to npm via TRUSTED PUBLISHING (OIDC) — no token, provenance automatic.
#
# The strongest line in our own outreach is that ~75% of scanned MCP servers ship with no build
# provenance — nothing tying the published tarball to the source repo it points at. tashan-cli 0.1.2
# was published from a laptop and is in that 75%. Telling people to check provenance while having
# none is the kind of thing an independent rater gets exactly one chance to be caught doing.
#
# WHY OIDC AND NOT AN NPM TOKEN. The first version of this workflow used `--provenance` with an
# NPM_TOKEN secret. Trusted publishing is strictly better on three counts:
#   - There is no long-lived credential. npm trusts THIS repo and THIS workflow file directly, so
#     there is no secret to leak, rotate, or scope wrong.
#   - Provenance is generated automatically. No `--provenance` flag, and no way to publish
#     unattested by forgetting one.
#   - It survives 2FA enforcement. npm's "require 2FA and disallow tokens" setting blocks token
#     auth and leaves OIDC working, so the account can be locked down without breaking releases.
#
# ONE-TIME SETUP (a human must do this once — the workflow cannot grant itself trust):
#   npmjs.com -> the `tashan-cli` package -> Settings -> Trusted Publisher -> Select your publisher
#     Publisher:          GitHub Actions
#     Organization/user:  FlyingWHR
#     Repository:         tashan
#     Workflow filename:  publish-cli.yml        <- FILENAME ONLY, case-sensitive, with .yml
#     Environment:        (leave blank)
#     Allowed actions:    npm publish
#   Every field is matched exactly. "publish-cli" or ".github/workflows/publish-cli.yml" both fail.
#   RENAMING THIS FILE BREAKS PUBLISHING until the setting is updated to match.
#
# Deliberately manual (`workflow_dispatch`), not on push: publishing is outward-facing and
# irreversible — npm unpublish is restricted after 72 hours — so it happens when a human says so.
# This workflow both dispatches AND publishes; do not split the publish into a reusable workflow,
# because npm validates the name of the CALLING workflow, not the one running `npm publish`.
name: publish cli

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Pack and verify only — do not publish"
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write        # REQUIRED: this is the OIDC token npm exchanges for publish rights

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # >= 22.14.0 is npm's documented floor for trusted publishing.
      - uses: actions/setup-node@v4
        with:
          node-version: "22.14"
          registry-url: https://registry.npmjs.org/

      # THE TRAP: trusted publishing needs npm >= 11.5.1, and Node 22 ships npm 10.x. Without this
      # the publish fails on a version check, or — worse on an older CLI — silently falls back to
      # looking for a token that does not exist. Upgrade explicitly and print what we got, so the
      # log says which npm actually ran rather than which one we assumed.
      - name: npm >= 11.5.1 (trusted publishing requirement)
        run: |
          npm install -g npm@latest
          node -v
          NPM_V="$(npm -v)"; MIN=11.5.1
          # sort -V, not a hand-rolled semver compare: the first draft of this step built the version
          # in an `env:` block that resolved to the empty string, so the gate could only ever fail.
          # Comparing in the shell keeps the value and the check in one place where both are visible.
          if [ "$(printf '%s\n%s\n' "$MIN" "$NPM_V" | sort -V | head -1)" != "$MIN" ]; then
            echo "npm $NPM_V is below $MIN — trusted publishing will fail, or an older CLI will"
            echo "silently look for a token that does not exist."; exit 1
          fi
          echo "npm $NPM_V supports trusted publishing"

      # The published package is the artifact, not the repo. npm's `bin` entries are SYMLINKS on
      # install, so argv[1] never equals import.meta.url on a real machine — a bug that only appears
      # in the installed tarball and passed every in-repo run. Test what ships.
      - name: test
        working-directory: cli
        run: npm test

      # ESM, and --input-type=module rather than a bare `node -e`: cli/package.json declares
      # "type": "module", so which module system `-e` gets depends on the Node version. Pinning it
      # means this step cannot start failing on a runner image bump for a reason unrelated to us.
      - name: pack and inspect what would ship
        working-directory: cli
        run: |
          npm pack --dry-run
          node --input-type=module -e "
            import { readFileSync } from 'node:fs';
            const p = JSON.parse(readFileSync('./package.json', 'utf8'));
            for (const [name, rel] of Object.entries(p.bin || {})) {
              if (!(p.files || []).includes(rel)) {
                console.error('bin ' + name + ' -> ' + rel + ' is not in files[]; it would not ship');
                process.exit(1);
              }
            }
            // The MCP registry rejects a publish whose package.json mcpName does not match
            // server.json's name. Both files are individually valid, so this is invisible until the
            // registry publish fails — after the DNS record and signing key are already set up.
            const s = JSON.parse(readFileSync('../server.json', 'utf8'));
            if (p.mcpName !== s.name) {
              console.error('mcpName ' + p.mcpName + ' != server.json name ' + s.name);
              process.exit(1);
            }
            if (p.version !== s.version) {
              console.error('version ' + p.version + ' != server.json version ' + s.version);
              process.exit(1);
            }
            console.log('bin entries ship:', Object.keys(p.bin).join(', '));
            console.log('mcpName agrees with server.json:', p.mcpName, '@', p.version);
          "

      # No NODE_AUTH_TOKEN and no --provenance: OIDC supplies the credential and npm attaches the
      # attestation itself. If this fails with an auth error, the trusted publisher above has not
      # been configured yet, or one of its fields does not match this repo exactly.
      - name: publish
        if: ${{ !inputs.dry_run }}
        working-directory: cli
        run: npm publish --access public

      # Reads back what npm actually recorded. A publish that lost provenance would otherwise look
      # identical to a good one, and we would go on citing a number we had quietly stopped meeting.
      - name: verify provenance landed
        if: ${{ !inputs.dry_run }}
        run: |
          sleep 15
          node --input-type=module -e "
            import { readFileSync } from 'node:fs';
            const v = JSON.parse(readFileSync('./cli/package.json', 'utf8')).version;
            const d = await fetch('https://registry.npmjs.org/tashan-cli').then(r => r.json());
            const att = !!d.versions?.[v]?.dist?.attestations;
            console.log('tashan-cli@' + v + ' attestations:', att);
            if (!att) {
              console.error('published WITHOUT provenance — check id-token: write and that the');
              console.error('trusted publisher names this exact workflow file.');
              process.exit(1);
            }
          "
